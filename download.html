<script>
function redirectUser() {
    const userAgent = navigator.userAgent || navigator.vendor||  window.opera;

    if (/android/i.test(userAgent)) {
        // Opens Google Play app if installed
        window.location.href =
            "market://details?id=com.kash.marketplace";

        // Fallback to web Play Store after 2 seconds
        setTimeout(() => {
            window.location.href =
                "https://play.google.com/store/apps/details?id=com.kash.marketplace";
        }, 2000);

    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        // Opens App Store app
        window.location.href =
            "itms-apps://itunes.apple.com/app/id6761426654";

        // Fallback to web App Store
        setTimeout(() => {
            window.location.href =
                "https://apps.apple.com/us/app/kash/id6761426654";
        }, 2000);

    } else {
        window.location.href = "https://kash.digetech.org";
    }
}

window.onload = redirectUser;
</script>
